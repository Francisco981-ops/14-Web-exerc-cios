<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DummyJSON</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h1 class="text-center mb-4">Produtos DummyJSON</h1>

        <button class="btn btn-success mb-3" onclick="buscarProdutos()">
            Buscar Produtos
        </button>

        <div id="resultado"></div>

    </div>

</div>

<script>

async function buscarProdutos() {

    const resposta = await fetch('https://dummyjson.com/products');

    const dados = await resposta.json();

    let html = '';

    dados.products.forEach(produto => {

        html += `
            <div class="card mb-3">
                <div class="card-body">
                    <h5>${produto.title}</h5>
                    <p>${produto.description}</p>
                    <p><strong>Preço:</strong> $${produto.price}</p>
                </div>
            </div>
        `;
    });

    document.getElementById('resultado').innerHTML = html;
}

</script>

</body>
</html>
