<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAPI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">

    <div class="card p-4 shadow bg-secondary">

        <h1 class="text-center mb-4">Personagens Star Wars</h1>

        <button class="btn btn-warning mb-3" onclick="buscarPersonagens()">
            Buscar Personagens
        </button>

        <div id="resultado"></div>

    </div>

</div>

<script>

async function buscarPersonagens() {

    const resposta = await fetch('https://swapi.dev/api/people/');

    const dados = await resposta.json();

    let html = '';

    dados.results.forEach(personagem => {

        html += `
            <div class="card mb-3">
                <div class="card-body text-dark">
                    <h5>${personagem.name}</h5>
                    <p><strong>Altura:</strong> ${personagem.height}</p>
                    <p><strong>Peso:</strong> ${personagem.mass}</p>
                    <p><strong>Gênero:</strong> ${personagem.gender}</p>
                </div>
            </div>
        `;
    });

    document.getElementById('resultado').innerHTML = html;
}

</script>

</body>
</html>
