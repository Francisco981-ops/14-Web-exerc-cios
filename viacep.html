<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CEP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="mb-4 text-center">Consulta CEP</h1>

        <div class="input-group mb-3">
            <input type="text" id="cep" class="form-control" placeholder="Digite o CEP">
            <button class="btn btn-primary" onclick="buscarCEP()">Buscar</button>
        </div>

        <pre id="resultado"></pre>

    </div>

</div>

<script>

async function buscarCEP() {

    const cep = document.getElementById('cep').value;

    const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);

    const dados = await resposta.json();

    document.getElementById('resultado').textContent = JSON.stringify(dados, null, 2);
}

</script>

</body>
</html>
